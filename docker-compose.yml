services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: sawa_united
      POSTGRES_USER: sawa_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - sawa_pgdata:/var/lib/postgresql/data
      - ./migrations/0001_initial_postgresql.sql:/docker-entrypoint-initdb.d/001-initial.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sawa_app -d sawa_united"]
      interval: 5s
      timeout: 5s
      retries: 20
  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-development}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      DATABASE_URL: postgresql+psycopg://sawa_app:${POSTGRES_PASSWORD}@db:5432/sawa_united
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-admin@sawa.local}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:?Set BOOTSTRAP_ADMIN_PASSWORD in .env}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-12}
      UPLOAD_ROOT: /app/private_uploads
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - sawa_uploads:/app/private_uploads
volumes:
  sawa_pgdata:
  sawa_uploads:
