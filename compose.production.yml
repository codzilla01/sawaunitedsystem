# Standalone deployment: docker compose --env-file .env -f compose.production.yml up -d --build
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: sawa_united
      POSTGRES_USER: sawa_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - sawa_pgdata:/var/lib/postgresql/data
      - ./migrations/0001_initial_postgresql.sql:/docker-entrypoint-initdb.d/001-initial.sql:ro
      - ./migrations/0002_login_budgets.sql:/docker-entrypoint-initdb.d/002-login-budgets.sql:ro
      - ./migrations/0003_mfa_sessions.sql:/docker-entrypoint-initdb.d/003-mfa-sessions.sql:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U sawa_app -d sawa_united"]
      interval: 5s
      timeout: 5s
      retries: 20
  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: production
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY}
      MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY:?Set MFA_ENCRYPTION_KEY}
      DATABASE_URL: postgresql+psycopg://sawa_app:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/sawa_united
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:?Set BOOTSTRAP_ADMIN_EMAIL}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?Set PUBLIC_ORIGIN}
      COOKIE_SECURE: "true"
      S3_BUCKET: ${S3_BUCKET:?Set S3_BUCKET}
      S3_REGION: ${S3_REGION:?Set S3_REGION}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:?Set AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:?Set AWS_SECRET_ACCESS_KEY}
      DOCUMENT_SCANNER_URL: ${DOCUMENT_SCANNER_URL:?Set DOCUMENT_SCANNER_URL}
      DOCUMENT_SCANNER_TOKEN: ${DOCUMENT_SCANNER_TOKEN:?Set DOCUMENT_SCANNER_TOKEN}
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
  proxy:
    image: nginx:stable-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/tls:/etc/nginx/tls:ro
volumes:
  sawa_pgdata:
