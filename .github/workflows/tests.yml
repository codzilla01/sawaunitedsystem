name: Application checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: sawa_test
          POSTGRES_USER: sawa_test
          POSTGRES_PASSWORD: ci-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sawa_test -d sawa_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - run: pip install -r requirements.lock
      - name: Generate an ephemeral CI-only MFA encryption key
        run: echo "MFA_ENCRYPTION_KEY=$(python -c 'from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())')" >> "$GITHUB_ENV"
      - name: Unit and API tests (SQLite)
        run: python -m pytest -q
      - name: Apply initial PostgreSQL migration
        env:
          PGPASSWORD: ci-only-password
        run: psql -h localhost -U sawa_test -d sawa_test -v ON_ERROR_STOP=1 --single-transaction -f migrations/0001_initial_postgresql.sql
      - name: Apply shared login limit migration
        env:
          PGPASSWORD: ci-only-password
        run: psql -h localhost -U sawa_test -d sawa_test -v ON_ERROR_STOP=1 --single-transaction -f migrations/0002_login_budgets.sql
      - name: Apply MFA and verified-session migration
        env:
          PGPASSWORD: ci-only-password
        run: psql -h localhost -U sawa_test -d sawa_test -v ON_ERROR_STOP=1 --single-transaction -f migrations/0003_mfa_sessions.sql
      - name: PostgreSQL migration, concurrency, stock and permission tests
        env:
          PGPASSWORD: ci-only-password
          PGHOST: localhost
          PGPORT: '5432'
          PGUSER: sawa_test
          PGDATABASE: sawa_test
          APP_ENV: development
          DATABASE_URL: postgresql+psycopg://sawa_test:ci-only-password@localhost:5432/sawa_test
          TEST_POSTGRES_URL: postgresql+psycopg://sawa_test:ci-only-password@localhost:5432/sawa_test
          BOOTSTRAP_ADMIN_EMAIL: admin@ci.example
          BOOTSTRAP_ADMIN_PASSWORD: ci-only-bootstrap-password-long
        run: |
          set +e
          python -m pytest -q tests/test_postgres_integration.py > /tmp/postgres-integration.log 2>&1
          test_status=$?
          cat /tmp/postgres-integration.log
          if [ "$test_status" -ne 0 ]; then
            python - <<'PY'
          from pathlib import Path
          for line in Path('/tmp/postgres-integration.log').read_text(errors='replace').splitlines()[-30:]:
              safe = line.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print(f'::error::{safe}')
          PY
          fi
          exit "$test_status"
      - name: Production startup smoke test against migrated PostgreSQL
        env:
          APP_ENV: production
          DATABASE_URL: postgresql+psycopg://sawa_test:ci-only-password@localhost:5432/sawa_test
          SECRET_KEY: ci-only-secret-not-for-deployment-012345678901234567890123456789
          BOOTSTRAP_ADMIN_EMAIL: admin@ci.example
          BOOTSTRAP_ADMIN_PASSWORD: ci-only-admin-password-not-for-deployment
          COOKIE_SECURE: 'true'
          PUBLIC_ORIGIN: https://ci.example
          S3_BUCKET: ci-private-documents
          S3_REGION: us-east-1
          DOCUMENT_SCANNER_URL: https://scanner.ci.example/scan
          DOCUMENT_SCANNER_TOKEN: ci-only-scanner-token
        run: python -c "from app.main import startup; startup(initialize=True); startup()"
      - name: Backup and restore PostgreSQL into a disposable database
        env:
          PGPASSWORD: ci-only-password
        run: |
          set -euo pipefail
          service_id=$(docker ps --filter ancestor=postgres:16-alpine --format '{{.ID}}' | head -n 1)
          if [[ -z "$service_id" ]]; then
            echo "::error::Could not find the PostgreSQL 16 service container for version-matched backup tools."
            exit 1
          fi
          service_image=$(docker inspect --format '{{.Config.Image}}' "$service_id")
          pg_dump_version=$(docker exec "$service_id" pg_dump --version)
          pg_restore_version=$(docker exec "$service_id" pg_restore --version)
          server_version=$(docker exec -e PGPASSWORD="$PGPASSWORD" "$service_id" psql -h localhost -U sawa_test -d sawa_test -Atqc "SHOW server_version_num")
          echo "Backup/restore compatibility: image=$service_image, $pg_dump_version, $pg_restore_version, server=$server_version"
          if [[ "$pg_dump_version" != *" 16."* || "$pg_restore_version" != *" 16."* || "$server_version" != 16* ]]; then
            echo "::error::Expected PostgreSQL 16 client/server tools, got image=$service_image, dump=$pg_dump_version, restore=$pg_restore_version, server=$server_version"
            exit 1
          fi
          check_command() {
            local label="$1"
            shift
            if ! "$@" > /tmp/sawa-ci-command.log 2>&1; then
              cat /tmp/sawa-ci-command.log
              echo "::error title=PostgreSQL backup/restore::$label failed (image=$service_image; dump=$pg_dump_version; restore=$pg_restore_version; server=$server_version)"
              while IFS= read -r line; do
                printf '::error::%s\n' "${line//'%'/'%25'}"
              done < <(tail -n 12 /tmp/sawa-ci-command.log)
              exit 1
            fi
            cat /tmp/sawa-ci-command.log
          }
          check_command pg_dump docker exec -e PGPASSWORD="$PGPASSWORD" "$service_id" pg_dump -h localhost -U sawa_test -d sawa_test --format=custom --no-owner --no-acl --file=/tmp/sawa-ci.dump
          check_command 'pg_restore --list' docker exec "$service_id" pg_restore --list /tmp/sawa-ci.dump
          check_command createdb docker exec -e PGPASSWORD="$PGPASSWORD" "$service_id" createdb -h localhost -U sawa_test sawa_restore_ci
          check_command pg_restore docker exec -e PGPASSWORD="$PGPASSWORD" "$service_id" pg_restore -h localhost -U sawa_test -d sawa_restore_ci --exit-on-error --single-transaction --no-owner --no-acl /tmp/sawa-ci.dump
          source_count=$(docker exec -e PGPASSWORD="$PGPASSWORD" "$service_id" psql -h localhost -U sawa_test -d sawa_test -Atqc "SELECT count(*) FROM information_schema.tables WHERE table_schema='public' AND table_type='BASE TABLE'")
          restored_count=$(docker exec -e PGPASSWORD="$PGPASSWORD" "$service_id" psql -h localhost -U sawa_test -d sawa_restore_ci -Atqc "SELECT count(*) FROM information_schema.tables WHERE table_schema='public' AND table_type='BASE TABLE'")
          if [[ "$source_count" != "$restored_count" ]]; then
            echo "::error::Restored table count mismatch: source=$source_count restored=$restored_count"
            exit 1
          fi
          restored_users=$(docker exec -e PGPASSWORD="$PGPASSWORD" "$service_id" psql -h localhost -U sawa_test -d sawa_restore_ci -Atqc "SELECT count(*) FROM users")
          if ! [[ "$restored_users" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::Restored users table is empty or invalid (count=$restored_users)."
            exit 1
          fi
          echo "PostgreSQL backup restore verified ($restored_count tables, $restored_users users) with PostgreSQL 16 client tools."
