# Run on a dedicated scanner host. Only the TLS reverse proxy should expose /scan.
services:
  clamav:
    image: ${CLAMAV_IMAGE:?Set CLAMAV_IMAGE to a reviewed immutable ClamAV image digest}
    restart: unless-stopped
    expose:
      - "3310"
    volumes:
      - clamav_database:/var/lib/clamav
    security_opt:
      - no-new-privileges:true

  scanner:
    build:
      context: ../..
      dockerfile: deploy/scanner/Dockerfile
    restart: unless-stopped
    depends_on:
      - clamav
    environment:
      SCANNER_BEARER_TOKEN: ${DOCUMENT_SCANNER_TOKEN:?Set DOCUMENT_SCANNER_TOKEN}
      CLAMD_HOST: clamav
      CLAMD_PORT: "3310"
      CLAMD_TIMEOUT_SECONDS: "30"
      SCANNER_PORT: "8080"
    ports:
      - "127.0.0.1:${SCANNER_LOCAL_PORT:-8081}:8080"
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid,nodev
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/ready', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  clamav_database:
